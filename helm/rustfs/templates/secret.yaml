{{- if not .Values.secret.existingSecret }}
{{- $usingDefaultCreds := and (eq .Values.secret.rustfs.access_key "rustfsadmin") (eq .Values.secret.rustfs.secret_key "rustfsadmin") }}
{{- if and $usingDefaultCreds (not .Values.secret.allowDefaultCredentials) }}
{{- fail "secret.rustfs.access_key/secret_key are still set to the well-known default 'rustfsadmin'/'rustfsadmin'. Set secret.existingSecret to reference a Secret you manage, or override secret.rustfs.access_key/secret_key with unique credentials. If you understand the risk and really want to proceed with the defaults, set secret.allowDefaultCredentials=true." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ .Values.secret.rustfs.access_key | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.secret.rustfs.secret_key | b64enc | quote }}
{{- end }}

---
{{- if .Values.imageRegistryCredentials.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.imagePullSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
